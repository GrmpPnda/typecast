[project]
name = "typecast"
version = "0.1.0"
description = "Novel-writing web application backend"
requires-python = ">=3.11"
# The licence text lives at the repository root; a license-files entry pointing
# there produces a "licenses/../LICENSE" path inside the wheel.
license = "GPL-3.0-or-later"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.27.0",
    "sqlalchemy[asyncio]>=2.0.25",
    "aiosqlite>=0.19.0",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    "alembic>=1.13.0",
    "python-multipart>=0.0.6",
    "weasyprint>=61.0",
    "ebooklib>=0.18",
    "anthropic>=0.18.0",
    "openai>=1.10.0",
    "boto3>=1.34.0",
    "pyyaml>=6.0",
    "markdown>=3.5",
    "aiofiles>=23.0",
    "Pillow>=10.0",
    "python-docx>=1.1.0",
    "reportlab>=4.0",
    # Encrypts stored API keys in app/services/crypto.py. Nothing else pulls it
    # in, so leaving it undeclared made every container image fail at import
    # with ModuleNotFoundError while a developer machine that had it installed
    # by hand worked fine.
    "cryptography>=42.0",
    # Imported directly, not just transitively. boto3, weasyprint, and fastapi
    # each happen to supply one of these today, but a release that drops the
    # dependency would break us silently.
    "botocore>=1.34.0",
    "fonttools>=4.0",
    "starlette>=0.37",
    # Runtime dependency, not test-only: app/services/gdrive.py makes every
    # Google Drive call through it. It used to live in [dev] because the test
    # client also needs it, which meant the container image never had it.
    "httpx>=0.26.0",
    # Verifies identity tokens from the single sign-on provider (proxy auth mode).
    "PyJWT>=2.8",
]

[project.optional-dependencies]
# Postgres driver for the container deployment. An extra rather than a direct
# dependency so local SQLite development does not build a compiled package it
# never loads; the deployment Dockerfile installs ".[postgres]".
postgres = [
    "asyncpg>=0.29",
]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
target-version = "py311"
line-length = 100
# Alembic writes revisions from its own template (typing.Union, unsorted imports,
# trailing whitespace). Reformatting generated migrations is churn, and a
# migration must not be edited after it has been applied anywhere.
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
