<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!--
  Names the font picker and profiles use, mapped to fonts the image installs.
  binding="same" makes a substitute count as the named font, so it is used
  rather than a generic fallback. Metric-compatible substitutes break lines and
  pages exactly as the original would: Gelasio for Georgia (identical advance
  widths), Liberation for Times New Roman and Arial, URW P052 for Palatino.
  The rest are the closest free design.
-->
<fontconfig>
  <alias binding="same"><family>Georgia</family><prefer><family>Gelasio</family></prefer></alias>
  <alias binding="same"><family>Garamond</family><prefer><family>EB Garamond</family></prefer></alias>
  <alias binding="same"><family>Palatino</family><prefer><family>P052</family></prefer></alias>
  <alias binding="same"><family>Palatino Linotype</family><prefer><family>P052</family></prefer></alias>
  <alias binding="same"><family>Book Antiqua</family><prefer><family>P052</family></prefer></alias>
  <alias binding="same"><family>Baskerville</family><prefer><family>Libre Baskerville</family></prefer></alias>
  <alias binding="same"><family>Times New Roman</family><prefer><family>Liberation Serif</family></prefer></alias>
  <alias binding="same"><family>Times</family><prefer><family>Liberation Serif</family></prefer></alias>
  <alias binding="same"><family>Arial</family><prefer><family>Liberation Sans</family></prefer></alias>
  <alias binding="same"><family>Helvetica</family><prefer><family>Nimbus Sans</family><family>Liberation Sans</family></prefer></alias>
  <alias binding="same"><family>Verdana</family><prefer><family>DejaVu Sans</family></prefer></alias>
  <alias binding="same"><family>Source Serif Pro</family><prefer><family>Source Serif 4</family></prefer></alias>
  <!-- The picker's sans-serif entries say 'sans serif', which is a family name, not the generic. -->
  <alias binding="same"><family>sans serif</family><prefer><family>Liberation Sans</family></prefer></alias>
  <!-- Generic families: a real text face, never an uploaded display font. -->
  <alias><family>serif</family><prefer><family>Liberation Serif</family><family>DejaVu Serif</family></prefer></alias>
  <alias><family>sans-serif</family><prefer><family>Liberation Sans</family><family>DejaVu Sans</family></prefer></alias>
  <alias><family>monospace</family><prefer><family>Liberation Mono</family><family>DejaVu Sans Mono</family></prefer></alias>
</fontconfig>
