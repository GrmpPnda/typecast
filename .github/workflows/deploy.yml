name: Deploy

# Every push to main is tested, built into an image, and rolled out to Azure
# Container Apps. The rollout is skipped until the Azure variables exist (see
# infra/README.md), so the first pushes just publish images.
on:
  push:
    branches: [main]
  workflow_dispatch:

# One deploy at a time, in order; never cancel one halfway.
concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  test:
    uses: ./.github/workflows/ci.yml

  image:
    name: Build and publish image
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.ref.outputs.image }}
    steps:
      - uses: actions/checkout@v4
      - name: Image name
        id: ref
        # Registry paths must be lowercase; the account name is not.
        run: |
          repo="${GITHUB_REPOSITORY,,}"
          echo "base=ghcr.io/${repo}" >> "$GITHUB_OUTPUT"
          echo "image=ghcr.io/${repo}:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          build-args: TYPECAST_VERSION=${{ github.sha }}
          tags: |
            ${{ steps.ref.outputs.image }}
            ${{ steps.ref.outputs.base }}:latest
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.licenses=GPL-3.0-or-later
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Roll out to Azure
    needs: image
    if: vars.AZURE_CLIENT_ID != ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write  # federated sign-in to Azure; no stored Azure secret
    env:
      RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
      APP_NAME: ${{ vars.AZURE_CONTAINERAPP_NAME || 'typecast' }}
      IMAGE: ${{ needs.image.outputs.image }}
    steps:
      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Point the app at the new image
        run: |
          az containerapp update \
            --name "$APP_NAME" --resource-group "$RESOURCE_GROUP" \
            --image "$IMAGE" --output none
      - name: Wait for the new revision to answer
        # The app scales to zero, so the first request also wakes it and runs any
        # migrations. /api/health is excluded from sign-in and reports the commit.
        run: |
          fqdn=$(az containerapp show --name "$APP_NAME" --resource-group "$RESOURCE_GROUP" \
                   --query properties.configuration.ingress.fqdn --output tsv)
          for _ in $(seq 1 60); do
            version=$(curl -fsS "https://${fqdn}/api/health" | jq -r .version || true)
            if [ "$version" = "$GITHUB_SHA" ]; then
              echo "Live at https://${fqdn} (${version})"
              exit 0
            fi
            echo "waiting: serving ${version:-nothing yet}"
            sleep 10
          done
          echo "::error::https://${fqdn} did not start serving ${GITHUB_SHA} within 10 minutes"
          az containerapp logs show --name "$APP_NAME" --resource-group "$RESOURCE_GROUP" --tail 100 || true
          exit 1
