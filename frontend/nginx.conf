# A TLS-terminating proxy in front of this container (Azure ingress, a load
# balancer) sets X-Forwarded-Proto: https. Pass that through rather than
# overwriting it with this hop's own scheme, which is plain http, or every
# backend redirect would send the browser to http://.
map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

# Plain HTTP exists only to send the browser to HTTPS. TYPECAST_HTTPS_PORT is
# substituted at container start (this file is installed as a template), so the
# redirect names the port the host actually publishes.
server {
    listen 80;
    server_name _;

    location / {
        return 301 https://$host:${TYPECAST_HTTPS_PORT}$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name _;

    # Generated self-signed on first start if absent (docker-entrypoint.d/
    # 40-typecast-tls.sh); mount real ones over these paths to replace them.
    ssl_certificate     /etc/nginx/certs/tls.crt;
    ssl_certificate_key /etc/nginx/certs/tls.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:TLS:10m;
    ssl_session_timeout 1d;

    # No Strict-Transport-Security here on purpose. Reached through an SSH
    # tunnel the host is "localhost", and once a browser trusts this
    # certificate HSTS would force HTTPS on every localhost port, breaking any
    # plain-HTTP development server. Terminate with a real certificate and set
    # TYPECAST_FORCE_HTTPS=1 on the backend to get HSTS where it is safe.

    root /usr/share/nginx/html;
    index index.html;

    # Cover images, fonts, and a backup restore all post bodies far larger than
    # nginx's 1m default, which would reject them with 413 before the backend
    # ever saw the request.
    client_max_body_size 200m;

    # Serve static files directly
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Proxy API requests to the backend
    location /api/ {
        proxy_pass http://backend:8000;
        # $http_host, not $host: $host drops the port, so the backend's
        # trailing-slash redirects pointed at port 80 and the browser's request
        # went nowhere. The library, codex, and every create call failed silently.
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;

        # AI chat and narration are Server-Sent Events. Buffering would hold the
        # whole stream back and deliver it in one lump at the end.
        proxy_buffering off;
        proxy_read_timeout 1h;
    }

    # Uploaded covers, gallery and codex images, and custom fonts. The backend
    # hands out absolute "/uploads/..." paths and serves them from a StaticFiles
    # mount, so without this every image on the site 404s. The Vite dev server
    # proxies the same prefix.
    location /uploads/ {
        proxy_pass http://backend:8000;
        # $http_host, not $host: $host drops the port, so the backend's
        # trailing-slash redirects pointed at port 80 and the browser's request
        # went nowhere. The library, codex, and every create call failed silently.
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
    }

    # SPA fallback: serve index.html for all other routes
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Disable access to dotfiles
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
}
