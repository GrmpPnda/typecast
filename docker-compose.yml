version: "3.9"

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    # Not published to the host. The backend is reachable only through the
    # frontend's nginx, which terminates TLS; publishing 8000 would let any
    # client bypass TLS and spoof the X-Forwarded-* headers uvicorn trusts.
    expose:
      - "8000"
    volumes:
      - ./profiles:/app/profiles
      - typecast-data:/app/data
    env_file:
      - .env
    environment:
      # Must match the typecast-data mount above. Set here as well as in the
      # Dockerfile so an override in .env cannot separate the data from its volume.
      TYPECAST_DATA_DIR: /app/data
    networks:
      - typecast-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "${TYPECAST_HTTP_PORT:-80}:80"     # redirects to HTTPS
      - "${TYPECAST_HTTPS_PORT:-443}:443"
    environment:
      # The published HTTPS port, for the HTTP-to-HTTPS redirect.
      TYPECAST_HTTPS_PORT: "${TYPECAST_HTTPS_PORT:-443}"
      # Name on the generated self-signed certificate. Set it to the hostname
      # people type, or mount a real certificate instead (see README).
      TYPECAST_TLS_HOSTNAME: "${TYPECAST_TLS_HOSTNAME:-localhost}"
    volumes:
      # Keeps the generated certificate across rebuilds, so a browser exception
      # you accept stays valid. Replace with a bind mount to use real ones:
      #   - ./certs:/etc/nginx/certs:ro   (tls.crt and tls.key)
      - typecast-certs:/etc/nginx/certs
    depends_on:
      - backend
    networks:
      - typecast-net

  # Uncomment below to use PostgreSQL instead of SQLite.
  # Update DATABASE_URL in .env to: postgresql+asyncpg://typecast:typecast@db:5432/typecast
  #
  # db:
  #   image: postgres:16-alpine
  #   environment:
  #     POSTGRES_USER: typecast
  #     POSTGRES_PASSWORD: typecast
  #     POSTGRES_DB: typecast
  #   ports:
  #     - "5432:5432"
  #   volumes:
  #     - pgdata:/var/lib/postgresql/data
  #   networks:
  #     - typecast-net
  #   healthcheck:
  #     test: ["CMD-SHELL", "pg_isready -U typecast"]
  #     interval: 10s
  #     timeout: 5s
  #     retries: 5

networks:
  typecast-net:
    driver: bridge

volumes:
  typecast-data:
  typecast-certs:
#   pgdata:
